# Builds the Flutter web preview and publishes it to GitHub Pages:
# https://luichemo.github.io/OCTAVA/
# The web version is a preview for testers; the real app ships on iOS/Android.
name: Web preview (GitHub Pages)

on:
  push:
    branches: [flutter-setup, main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # same as C:\src\flutter
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The site lives under /OCTAVA/, so asset paths need that prefix.
      - run: flutter build web --release --base-href /OCTAVA/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
