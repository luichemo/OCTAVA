<!--
  Supabase → Authentication → Emails → Templates → Reset Password.
  Subject: Reset your OCTAVA password
  Paste this as the message body. The link goes to the web preview with the
  one-time code (`?reset=`), which works on any device or browser; the app
  (AuthGate → PasswordResetScreen) signs in with it and asks for a new password.
-->
<div style="font-family: Inter, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #22328C;">
  <h1 style="font-size: 28px; letter-spacing: 1px; margin: 0 0 16px;">OCTAVA</h1>

  <p style="font-size: 16px; line-height: 1.5;">Someone asked to reset the password for your OCTAVA account. Tap the button to choose a new one. The link works once and expires in an hour.</p>

  <p style="margin: 28px 0;">
    <a href="https://luichemo.github.io/OCTAVA/?reset={{ .TokenHash }}"
       style="background: #FF4FA3; color: #22328C; font-weight: 700; text-decoration: none; padding: 14px 26px; border-radius: 999px; border: 2px solid #22328C; display: inline-block;">
      Choose a new password
    </a>
  </p>

  <p style="font-size: 13px; line-height: 1.5; color: #56619E;">If you didn't ask for this, ignore this email; your password stays the same.</p>
</div>
