<!--
  Supabase → Authentication → Emails → Templates → Confirm signup.
  Subject: Confirm your OCTAVA account
  Paste this as the message body. {{ .ConfirmationURL }} confirms the address
  and returns to the page sign-up came from (the web preview, or the Site URL
  for phone sign-ups), already signed in (implicit auth flow).
-->
<div style="font-family: Inter, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #22328C;">
  <h1 style="font-size: 28px; letter-spacing: 1px; margin: 0 0 16px;">OCTAVA</h1>

  <p style="font-size: 16px; line-height: 1.5;">Welcome to OCTAVA! Tap the button to confirm your email address and start finding people to play with.</p>

  <p style="margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #FF4FA3; color: #22328C; font-weight: 700; text-decoration: none; padding: 14px 26px; border-radius: 999px; border: 2px solid #22328C; display: inline-block;">
      Confirm my email
    </a>
  </p>

  <p style="font-size: 13px; line-height: 1.5; color: #56619E;">If you didn't create an OCTAVA account, ignore this email.</p>
</div>
